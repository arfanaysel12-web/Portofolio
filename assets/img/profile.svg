<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="Portrait of Arfan Aysel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="450" cy="430" r="250"/>
    </clipPath>
  </defs>
  <rect width="900" height="900" fill="#0B0B0B"/>
  <rect width="900" height="900" fill="url(#glow)"/>
  <circle cx="450" cy="430" r="270" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="14 10" opacity="0.7"/>
  <g clip-path="url(#circle)">
    <circle cx="450" cy="430" r="250" fill="url(#bg)"/>
    <circle cx="450" cy="300" r="95" fill="#0B0B0B" opacity="0.9"/>
    <rect x="200" y="470" width="500" height="280" rx="60" fill="#0B0B0B" opacity="0.9"/>
    <circle cx="450" cy="300" r="60" fill="#3B82F6"/>
  </g>
  <text x="450" y="318" font-family="Poppins, Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle">AA</text>
  <text x="450" y="860" font-family="Poppins, Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="#A1A1AA" text-anchor="middle" letter-spacing="6">ARFAN AYSEL</text>
</svg>
